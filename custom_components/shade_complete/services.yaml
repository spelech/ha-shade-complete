calibrate_battery:
  name: Calibrate Battery
  description: Manually seed or adjust the learned 0-100% calibration endpoints for a shade battery sensor.
  fields:
    entity_id:
      name: Battery Sensor Entity
      description: The calibrated battery sensor entity ID to update.
      required: true
      selector:
        entity:
          domain: sensor
    min_val:
      name: Minimum Reading
      description: Value representing 0% battery (e.g. 6.4V).
      required: false
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 0.1
          mode: box
    max_val:
      name: Maximum Reading
      description: Value representing 100% battery (e.g. 8.4V).
      required: false
      selector:
        number:
          min: 0.0
          max: 100.0
          step: 0.1
          mode: box

reset_manual_override:
  name: Reset Manual Override
  description: Clear any active manual override lock and immediately resume automatic sun tracking.
  fields:
    entity_id:
      name: Shade Entity
      description: The Smart Shade cover entity ID to unlock.
      required: true
      selector:
        entity:
          domain: cover
          multiple: true

trigger_auto_close:
  name: Trigger Auto Close
  description: Immediately invoke the evening closing routine for the specified shade.
  fields:
    entity_id:
      name: Shade Entity
      description: The Smart Shade cover entity ID to close.
      required: true
      selector:
        entity:
          domain: cover
          multiple: true

trigger_auto_open:
  name: Trigger Auto Open
  description: Immediately invoke the morning opening routine for the specified shade.
  fields:
    entity_id:
      name: Shade Entity
      description: The Smart Shade cover entity ID to open.
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
