[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-shade-complete"
version = "1.2.4"
description = "Home Assistant integration for complete shade control: sun tracking, tilt entities, scheduled closing, and adaptive battery calibration."
authors = [{name = "Steven T. Pelech"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "homeassistant>=2024.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/shade_complete"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
